<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>学習記録アプリ v3.1</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        body { background-color: #f8fafc; font-family: sans-serif; }
        .answer-btn { flex: 1; height: 64px; font-size: 1.5rem; font-weight: bold; }
        /* スマホでのズーム防止のため入力欄のフォントサイズを16px以上に固定 */
        input, select, textarea { font-size: 16px !important; }
        .back-to-top { position: fixed; bottom: 100px; right: 20px; z-index: 50; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            const svgRef = useRef(null);
            useEffect(() => {
                if (svgRef.current && window.lucide) {
                    window.lucide.createIcons({
                        icons: { [name]: window.lucide.icons[name] },
                        nameAttr: 'data-lucide',
                        root: svgRef.current.parentElement
                    });
                }
            }, [name]);
            return <i ref={svgRef} data-lucide={name} width={size} height={size} className={className}></i>;
        };

        function App() {
            const [view, setView] = useState('setup'); 
            const [setName, setSetName] = useState('');
            const [answers, setAnswers] = useState({});
            const [scores, setScores] = useState({});
            const [notes, setNotes] = useState({});
            const [correctAnswers, setCorrectAnswers] = useState({}); 
            const [history, setHistory] = useState([]);
            const [testSessions, setTestSessions] = useState([]);
            const [filterSetName, setFilterSetName] = useState('');
            
            // モード管理
            const [isRetesting, setIsRetesting] = useState(false);
            const [retestQuestions, setRetestQuestions] = useState([]);
            const [isGraded, setIsGraded] = useState(false); // 一括丸つけが完了したかどうか
            
            // UI制御
            const [showCorrectSetter, setShowCorrectSetter] = useState(null); 
            const [modalMsg, setModalMsg] = useState(null); // アラートの代わり

            const totalQuestions = 100;

            // 初期読み込み
            useEffect(() => {
                const savedHistory = localStorage.getItem('study_v2_history');
                const savedDict = localStorage.getItem('study_v2_dict');
                const savedSessions = localStorage.getItem('study_v3_sessions');
                if (savedHistory) setHistory(JSON.parse(savedHistory));
                if (savedDict) setCorrectAnswers(JSON.parse(savedDict));
                if (savedSessions) setTestSessions(JSON.parse(savedSessions));

                const savedSession = localStorage.getItem('study_v2_current');
                if (savedSession) {
                    const parsed = JSON.parse(savedSession);
                    setSetName(parsed.setName || '');
                    setAnswers(parsed.answers || {});
                    setScores(parsed.scores || {});
                    setNotes(parsed.notes || {});
                    setIsRetesting(parsed.isRetesting || false);
                    setRetestQuestions(parsed.retestQuestions || []);
                    setIsGraded(parsed.isGraded || false);
                    if (parsed.view === 'test') setView('test');
                }
            }, []);

            // オートセーブ
            useEffect(() => {
                if (view === 'test') {
                    localStorage.setItem('study_v2_current', JSON.stringify({ 
                        setName, answers, scores, notes, view, isRetesting, retestQuestions, isGraded 
                    }));
                }
                localStorage.setItem('study_v2_dict', JSON.stringify(correctAnswers));
            }, [setName, answers, scores, notes, view, correctAnswers, isRetesting, retestQuestions, isGraded]);

            // テスト開始（新規 or 解き直し）
            const startTest = (name, questions = null) => {
                if (!name.trim()) {
                    setModalMsg('セット名を入力してください');
                    return;
                }
                setSetName(name);
                setIsGraded(false); // 状態をリセット

                if (questions) {
                    // 解き直しモード（履歴や弱点リストからの起動）
                    setRetestQuestions(questions);
                    setIsRetesting(true);
                } else {
                    // 新規モード
                    setIsRetesting(false);
                    setRetestQuestions([]);
                }
                setView('test');
                window.scrollTo(0, 0);
            };

            // 中断処理
            const handleAbort = () => {
                setAnswers({}); setScores({}); setNotes({}); setSetName('');
                setIsGraded(false);
                localStorage.removeItem('study_v2_current');
                setView('setup');
            };

            // 採点ロジック（手動）: 主に新規テストで使用
            const handleManualScore = (qNum, status) => {
                const currentAnswer = answers[qNum];
                setScores(prev => ({ ...prev, [qNum]: status }));

                if (status === 'incorrect') {
                    setShowCorrectSetter(qNum); // 正解選択UIを表示
                } else if (status === 'correct' && currentAnswer) {
                    setCorrectAnswers(prev => ({ ...prev, [`${setName}-${qNum}`]: currentAnswer }));
                }
            };

            // 回答選択（自動判定は削除し、ネタバレを防止）
            const handleAnswerSelect = (qNum, val) => {
                setAnswers(prev => ({ ...prev, [qNum]: val }));
            };

            // 一括採点（解き直しモードで使用）
            const bulkGrade = () => {
                const newScores = { ...scores };
                qList.forEach(num => {
                    const dictKey = `${setName}-${num}`;
                    // 辞書に正解データがある問題のみ自動採点する
                    if (correctAnswers[dictKey]) {
                        if (answers[num] === correctAnswers[dictKey]) {
                            newScores[num] = 'correct';
                        } else {
                            newScores[num] = 'incorrect';
                        }
                    }
                });
                setScores(newScores);
                setIsGraded(true); // 丸つけ完了フラグをON
                window.scrollTo({top: 0, behavior: 'smooth'}); // 上部に戻して結果を見せる
            };

            // 記録して終了
            const finishTest = () => {
                const timestamp = new Date().toLocaleString();
                const newRecords = [];
                let correctCount = 0;
                const activeQs = qList;

                activeQs.forEach(qNum => {
                    if (scores[qNum]) {
                        if (scores[qNum] === 'correct') correctCount++;
                        newRecords.push({
                            id: Date.now() + Math.random(),
                            setName,
                            qNum: parseInt(qNum),
                            score: scores[qNum],
                            timestamp
                        });
                    }
                });

                const updatedHistory = [...history, ...newRecords];
                setHistory(updatedHistory);
                localStorage.setItem('study_v2_history', JSON.stringify(updatedHistory));

                const newSession = {
                    setName,
                    score: `${correctCount}/${activeQs.length}`,
                    timestamp
                };
                const updatedSessions = [newSession, ...testSessions];
                setTestSessions(updatedSessions);
                localStorage.setItem('study_v3_sessions', JSON.stringify(updatedSessions));
                
                // リセット
                setAnswers({}); setScores({}); setNotes({}); setSetName(''); setIsGraded(false);
                localStorage.removeItem('study_v2_current');
                setView('analysis');
            };

            // 現在の点数計算
            const currentScore = useMemo(() => {
                return Object.values(scores).filter(s => s === 'correct').length;
            }, [scores]);

            // 分析データ集計
            const filteredData = useMemo(() => {
                const aggregated = {};
                history.forEach(r => {
                    if (filterSetName && r.setName !== filterSetName) return;
                    const key = `${r.setName}-${r.qNum}`;
                    if (!aggregated[key]) {
                        aggregated[key] = { setName: r.setName, qNum: r.qNum, correct: 0, incorrect: 0 };
                    }
                    if (r.score === 'correct') aggregated[key].correct++;
                    else aggregated[key].incorrect++;
                });
                // バツがあるものだけ抽出
                return Object.values(aggregated).filter(d => d.incorrect > 0).sort((a, b) => b.incorrect - a.incorrect);
            }, [history, filterSetName]);

            // プルダウン用のセット名一覧
            const setNamesList = useMemo(() => {
                const names = new Set(history.map(r => r.setName));
                return Array.from(names).sort();
            }, [history]);

            const qList = isRetesting ? retestQuestions : Array.from({ length: totalQuestions }, (_, i) => i + 1);

            return (
                <div className="flex flex-col min-h-screen bg-slate-50 pb-10">
                    
                    {/* カスタムアラートモーダル */}
                    {modalMsg && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 w-full max-w-sm text-center shadow-2xl transform transition-all">
                                <div className="text-amber-500 flex justify-center mb-4">
                                    <Icon name="AlertTriangle" size={48} />
                                </div>
                                <p className="text-lg font-bold text-slate-800 mb-6">{modalMsg}</p>
                                <button 
                                    onClick={() => setModalMsg(null)}
                                    className="w-full py-4 bg-slate-100 text-slate-800 font-bold rounded-2xl active:scale-95"
                                >
                                    閉じる
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-40 shadow-sm">
                        <div className="flex flex-col">
                            <h1 className="font-black text-xl text-slate-800 flex items-center gap-2">
                                <Icon name="Zap" className="text-amber-500" size={24} />
                                <span>{view === 'test' ? setName : 'StudyV3'}</span>
                            </h1>
                            {view === 'test' && (
                                <span className="text-xs font-bold text-blue-600 flex items-center gap-1">
                                    {isRetesting && <span className="bg-blue-100 text-blue-700 px-1 rounded text-[10px]">解き直し</span>}
                                    Score: {currentScore} / {qList.length}
                                </span>
                            )}
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setView('setup')} className={`p-2 rounded-lg ${view !== 'analysis' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}><Icon name="Edit3" /></button>
                            <button onClick={() => setView('analysis')} className={`p-2 rounded-lg ${view === 'analysis' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}><Icon name="BarChart2" /></button>
                        </div>
                    </header>

                    <main className="flex-1 p-4 max-w-4xl mx-auto w-full">
                        {/* Setup View */}
                        {view === 'setup' && (
                            <div className="space-y-6 mt-4">
                                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                                    <h2 className="text-2xl font-bold mb-6 flex items-center gap-2">
                                        <Icon name="PlusCircle" className="text-blue-500" /> 新規開拓テスト
                                    </h2>
                                    <p className="text-xs text-slate-500 mb-4">※過去に解いたセットは下の履歴から「リトライ」してください</p>
                                    <input 
                                        type="text" value={setName} onChange={e => setSetName(e.target.value)}
                                        placeholder="新しいセット名 (例: 4-01)"
                                        className="w-full p-5 text-xl border-2 rounded-2xl mb-6 outline-none focus:border-blue-500 transition-all bg-slate-50 focus:bg-white"
                                    />
                                    <button onClick={() => startTest(setName)} className="w-full bg-slate-800 text-white font-bold py-5 rounded-2xl text-xl shadow-lg active:scale-95 transition-transform">
                                        100問スタート
                                    </button>
                                </div>

                                {testSessions.length > 0 && (
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                                        <h3 className="font-bold text-slate-500 mb-4 flex items-center gap-2">
                                            <Icon name="History" size={18} /> 最近の解答履歴（ここから復習）
                                        </h3>
                                        <div className="space-y-3">
                                            {testSessions.slice(0, 15).map((s, i) => (
                                                <div key={i} className="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                                                    <div>
                                                        <div className="font-bold text-slate-800 text-lg">{s.setName}</div>
                                                        <div className="text-xs text-slate-400 mt-1">{s.timestamp}</div>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <div className="text-xl font-black text-slate-300">{s.score}</div>
                                                        <button 
                                                            onClick={() => startTest(s.setName, Array.from({length: totalQuestions}, (_, i) => i + 1))}
                                                            className="px-4 py-3 bg-blue-100 text-blue-700 rounded-xl font-bold text-sm hover:bg-blue-200 active:scale-95 transition-all flex items-center gap-2 shadow-sm"
                                                        >
                                                            <Icon name="RefreshCw" size={16} /> リトライ
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Test View */}
                        {view === 'test' && (
                            <div className="pb-40">
                                <div className="space-y-6">
                                    {qList.map(num => (
                                        <div key={num} className={`bg-white rounded-3xl p-5 shadow-sm border relative overflow-hidden transition-colors ${scores[num] === 'incorrect' ? 'border-rose-200 bg-rose-50/30' : 'border-slate-100'}`}>
                                            <div className="flex justify-between items-center mb-4">
                                                <div className="flex items-center gap-3">
                                                    <span className="bg-slate-800 text-white w-10 h-10 flex items-center justify-center rounded-full font-bold">
                                                        {num}
                                                    </span>
                                                    {/* 正解の表示条件：スコアが確定している場合のみ表示（ネタバレ防止） */}
                                                    {(scores[num] !== undefined) && correctAnswers[`${setName}-${num}`] && (
                                                        <span className="text-sm font-bold bg-amber-100 text-amber-700 px-3 py-1 rounded-lg border border-amber-200 shadow-sm">
                                                            正解: {correctAnswers[`${setName}-${num}`]}
                                                        </span>
                                                    )}
                                                </div>
                                                
                                                <div className="flex gap-2 items-center">
                                                    {/* 個別クリア */}
                                                    <button 
                                                        onClick={() => {
                                                            const nA = {...answers}; delete nA[num]; setAnswers(nA);
                                                            const nS = {...scores}; delete nS[num]; setScores(nS);
                                                        }}
                                                        className="p-2 text-slate-300 hover:text-slate-500"
                                                    ><Icon name="XCircle" size={20}/></button>
                                                    
                                                    {/* 手動採点ボタン（新規モード用、または一括採点で漏れた問題用） */}
                                                    <div className="flex gap-1">
                                                        <button 
                                                            onClick={() => handleManualScore(num, 'correct')}
                                                            className={`w-12 h-12 rounded-full border-2 font-bold transition-all ${scores[num] === 'correct' ? 'bg-emerald-500 border-emerald-500 text-white shadow-md' : 'border-slate-200 text-slate-300 hover:border-emerald-200'}`}
                                                        >○</button>
                                                        <button 
                                                            onClick={() => handleManualScore(num, 'incorrect')}
                                                            className={`w-12 h-12 rounded-full border-2 font-bold transition-all ${scores[num] === 'incorrect' ? 'bg-rose-500 border-rose-500 text-white shadow-md' : 'border-slate-200 text-slate-300 hover:border-rose-200'}`}
                                                        >×</button>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* 回答ボタン */}
                                            <div className="flex gap-2 mb-3">
                                                {[1, 2, 3, 4].map(v => (
                                                    <button 
                                                        key={v}
                                                        onClick={() => handleAnswerSelect(num, v)}
                                                        className={`answer-btn rounded-2xl border-2 transition-all ${answers[num] === v ? 'bg-blue-600 border-blue-600 text-white shadow-md' : 'bg-white border-slate-200 text-slate-600'}`}
                                                    >{v}</button>
                                                ))}
                                            </div>

                                            <input 
                                                type="text" placeholder="メモ入力欄"
                                                value={notes[num] || ''}
                                                onChange={e => setNotes({...notes, [num]: e.target.value})}
                                                className="w-full bg-slate-50 p-3 rounded-xl border border-transparent focus:bg-white focus:border-slate-200 outline-none transition-colors text-slate-600"
                                            />

                                            {/* 正解選択ポップオーバー風UI（手動で×をつけた時用） */}
                                            {showCorrectSetter === num && (
                                                <div className="absolute inset-0 bg-slate-900/90 backdrop-blur-sm flex flex-col items-center justify-center p-4 z-10 text-white text-center rounded-3xl">
                                                    <div className="font-bold mb-4 text-lg">Q{num} の正しい正解(1-4)を選択</div>
                                                    <div className="flex gap-3 mb-6">
                                                        {[1, 2, 3, 4].map(v => (
                                                            <button 
                                                                key={`set-${v}`}
                                                                onClick={() => {
                                                                    setCorrectAnswers(prev => ({ ...prev, [`${setName}-${num}`]: v }));
                                                                    setShowCorrectSetter(null);
                                                                }}
                                                                className="w-14 h-14 bg-white text-slate-900 rounded-full font-black text-xl hover:bg-blue-500 hover:text-white transition-colors"
                                                            >{v}</button>
                                                        ))}
                                                    </div>
                                                    <button onClick={() => setShowCorrectSetter(null)} className="text-sm underline opacity-70 p-2">キャンセル</button>
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                {/* フローティング操作バー */}
                                <div className="fixed bottom-0 left-0 right-0 p-4 bg-white/90 backdrop-blur-md border-t shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)] z-40">
                                    <div className="max-w-4xl mx-auto grid grid-cols-3 gap-3">
                                        <button onClick={handleAbort} className="bg-slate-100 text-slate-600 font-bold py-4 rounded-2xl active:scale-95 transition-transform">中断</button>
                                        
                                        {/* 解き直しモードで、まだ丸つけしていない場合 */}
                                        {isRetesting && !isGraded ? (
                                            <button onClick={bulkGrade} className="col-span-2 bg-amber-500 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2 text-lg">
                                                <Icon name="CheckCircle" /> 一括丸つけ
                                            </button>
                                        ) : (
                                            <>
                                                {/* 丸つけ完了後、または新規モード */}
                                                <div className="bg-slate-50 rounded-2xl flex flex-col items-center justify-center border text-blue-700">
                                                    <span className="text-[10px] font-bold uppercase opacity-50">Score</span>
                                                    <span className="font-black text-xl leading-none">{currentScore}</span>
                                                </div>
                                                <button onClick={finishTest} className="bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg active:scale-95 transition-transform">記録終了</button>
                                            </>
                                        )}
                                    </div>
                                </div>

                                {/* トップに戻るボタン */}
                                <button 
                                    onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}
                                    className="back-to-top w-14 h-14 bg-slate-800/90 backdrop-blur text-white rounded-full flex items-center justify-center shadow-xl active:scale-90 transition-transform"
                                >
                                    <Icon name="ArrowUp" size={28} />
                                </button>
                            </div>
                        )}

                        {/* Analysis View */}
                        {view === 'analysis' && (
                            <div className="space-y-4">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border space-y-4">
                                    <div>
                                        <label className="text-xs font-bold text-slate-400 uppercase mb-2 block">問題セットを選択</label>
                                        <select 
                                            value={filterSetName} 
                                            onChange={e => setFilterSetName(e.target.value)}
                                            className="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 appearance-none font-bold text-slate-700"
                                        >
                                            <option value="">すべての弱点一覧</option>
                                            {setNamesList.map(name => <option key={name} value={name}>{name}</option>)}
                                        </select>
                                    </div>
                                    {filterSetName && (
                                        <button 
                                            onClick={() => {
                                                const wrongOnes = filteredData.map(d => d.qNum);
                                                if (wrongOnes.length === 0) {
                                                    setModalMsg('このセットに「×」の記録はありません🎉');
                                                    return;
                                                }
                                                startTest(filterSetName, wrongOnes);
                                            }}
                                            className="w-full bg-rose-500 text-white font-bold py-4 rounded-2xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-transform"
                                        >
                                            <Icon name="Target" size={20} />
                                            このセットの「×」問題を集中特訓
                                        </button>
                                    )}
                                </div>

                                <div className="bg-white rounded-3xl border shadow-sm overflow-hidden mb-10">
                                    <div className="p-5 border-b bg-slate-50">
                                        <h3 className="font-bold text-slate-700 flex items-center gap-2">
                                            <Icon name="AlertCircle" className="text-rose-500" size={20} /> 弱点リスト（累計）
                                        </h3>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full">
                                            <thead className="bg-slate-50 text-slate-400 text-[10px] font-bold uppercase">
                                                <tr>
                                                    <th className="p-4 text-left whitespace-nowrap">セット</th>
                                                    <th className="p-4 text-left">設問</th>
                                                    <th className="p-4 text-center">正解</th>
                                                    <th className="p-4 text-center">累計×</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {filteredData.map((item, idx) => (
                                                    <tr key={idx} className="hover:bg-slate-50 transition-colors">
                                                        <td className="p-4 text-sm font-medium text-slate-500 whitespace-nowrap">{item.setName}</td>
                                                        <td className="p-4 font-black text-xl text-slate-800">{item.qNum}</td>
                                                        <td className="p-4 text-center">
                                                            <span className="font-bold text-emerald-600 bg-emerald-50 px-3 py-1 rounded-lg border border-emerald-100">
                                                                {correctAnswers[`${item.setName}-${item.qNum}`] || '-'}
                                                            </span>
                                                        </td>
                                                        <td className="p-4 text-center">
                                                            <span className="inline-block px-3 py-1 rounded-full bg-rose-100 text-rose-600 font-bold border border-rose-200">
                                                                {item.incorrect}
                                                            </span>
                                                        </td>
                                                    </tr>
                                                ))}
                                                {filteredData.length === 0 && (
                                                    <tr><td colSpan="4" className="p-16 text-center text-slate-400 font-bold">×の記録はありません</td></tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
